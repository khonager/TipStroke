name: Shared Kotlin checks

on:
  push:
    branches: [stable, unstable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplatform-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-ios]') }}
  cancel-in-progress: true

jobs:
  apple-shared-code:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated Xcode project
        run: |
          python3 tools/generate-ios-project.py
          git diff --exit-code -- ios/TipStroke.xcodeproj
      - name: Build integrated iOS app
        run: xcodebuild build -project ios/TipStroke.xcodeproj -scheme TipStroke -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Run iPhone and iPad simulator suites when requested
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-ios]')
        run: bash tools/ios-test.sh
      - name: Check common code and Apple framework
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            simulator_test=iosSimulatorArm64Test
          else
            simulator_test=iosX64Test
          fi
          ./gradlew -Ptipstroke.appleOnly=true ":core:$simulator_test" ":shared-ui:$simulator_test" \
            :shared-ui:linkReleaseFrameworkIosArm64
