name: TipStroke TestFlight

on:
  push:
    branches: [unstable]
    paths:
      - 'ios/**'
      - 'core/**'
      - 'shared-ui/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '*.gradle.kts'
      - 'tools/*ios*'
      - 'app/src/main/res/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tipstroke-testflight
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check Apple credential availability
        id: credentials
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [[ -n "$CERT" && -n "$PROFILE" && -n "$KEY" && -n "$ISSUER" && -n "$KEY_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile release for iPhone and iPad while signing is unavailable
        if: steps.credentials.outputs.ready != 'true'
        run: |
          xcodebuild build -project ios/TipStroke.xcodeproj -scheme TipStroke \
            -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          echo "::error::Device build succeeded. Configure the Apple secrets listed in docs/IOS.md and rerun this job to sign and upload."
          exit 1

      - name: Install signing tools
        run: pipx install codemagic-cli-tools==0.73.0

      - name: Configure distribution signing on the temporary runner
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          umask 077
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE" | base64 -D > "$profiles/TipStroke.mobileprovision"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          keychain initialize
          keychain add-certificates --certificate "$RUNNER_TEMP/distribution.p12" --certificate-password @env:CERTIFICATE_PASSWORD
          xcode-project use-profiles --project ios/TipStroke.xcodeproj

      - name: Archive and export signed IPA
        run: |
          build=$((7 + GITHUB_RUN_NUMBER))
          if (( GITHUB_RUN_ATTEMPT > 1 )); then build="$build.$GITHUB_RUN_ATTEMPT"; fi
          xcode-project build-ipa --project ios/TipStroke.xcodeproj --scheme TipStroke \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$build"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f build/ios/ipa/TipStroke.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
